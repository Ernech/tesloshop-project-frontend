<div class="px-5">

  <split-hero-component></split-hero-component>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 mt-2 gap-3 px-12">
    @for (product of productResource.value()?.products; track $index) {
      <product-card [product]="product"/>

    }
    @empty {
      <p>No hay productos</p>
    }

  </div>

  <app-pagination [pages]="productResource.value()?.pages ?? 0" [currentPage]="paginationService.currentPage()"/>

</div>

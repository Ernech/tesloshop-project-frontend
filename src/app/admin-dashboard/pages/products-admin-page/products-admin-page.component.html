<h1 class="text-2xl font-bold">Listado de productos</h1>
<h3 class="text-lg">Total de productos:
  <span class="text-accent">{{productResource.value()?.count}}</span>
</h3>
<div class="divider"></div>

  <div class="flex gap-2 h-20">
    <app-pagination class="self-start ml-2" [pages]="productResource.value()?.pages ?? 0" [currentPage]="paginationService.currentPage()"/>
    <select class="select select-bordered w-32" #selectPerPage (change)="onSelectionChange(+selectPerPage.value)">
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="50">50</option>
      <option value="100">100</option>
    </select>
    <div class="flex flex-1"></div>

    <button
      class="btn btn-primary"
      routerLink="/admin/products/new">
      Nuevo producto
    </button>

  </div>
  <app-product-tables [products]="productResource.value()?.products ?? []"/>
